<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranowin Enterprises</title>
  <!-- Favicon eka -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Banner -->
  <div class="banner-container">
    <img src="banner-placeholder.svg" alt="Ranowin Banner" class="top-banner">
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <h1 data-i18n="brandTitle">Ranowin Enterprises</h1>
      <div class="lang-switch">
        <button type="button" class="lang-btn active" onclick="changeLang('en')">EN</button>
        <button type="button" class="lang-btn" onclick="changeLang('si')">SI</button>
        <button type="button" class="lang-btn" onclick="changeLang('ta')">TA</button>
      </div>
    </div>
  </header>

  <!-- Main Product Grid -->
  <main id="home-view" class="container">
    <div class="product-grid" id="productGrid">
      <p style="text-align:center; width:100%;">Loading products from Google Sheets...</p>
    </div>
  </main>

  <!-- Slide-in Checkout View (SPA) -->
  <div id="checkout-view" class="checkout-view">
    <div class="checkout-container">
      <button type="button" class="btn-back" onclick="closeCheckout()">&#8592; <span data-i18n="backBtn">Back</span></button>
      
      <div class="checkout-summary">
        <img id="chk-img" src="" alt="Bag">
        <h2 id="chk-title">Bag Name</h2>
        
        <div class="price-calc">
          <div class="calc-row">
            <span data-i18n="bagPriceTxt">Bag Price:</span>
            <span>Rs. <span id="chk-price">0</span></span>
          </div>
          <div class="calc-row fee-row">
            <span data-i18n="deliveryTxt">Delivery Fee:</span>
            <span>Rs. <span id="chk-delivery">0</span></span>
          </div>
          <div class="calc-row total-row">
            <span data-i18n="totalTxt">Total Amount:</span>
            <span>Rs. <span id="chk-total">0</span></span>
          </div>
        </div>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)">
        <div class="field">
          <label data-i18n="labelName">Name</label>
          <input type="text" id="custName" required>
        </div>
        <div class="field">
          <label data-i18n="labelAddress">Delivery Address</label>
          <input type="text" id="custAddress" required>
        </div>
        <div class="field">
          <label data-i18n="labelPhone">Phone Number</label>
          <!-- Strict number validation -->
          <input type="tel" id="custPhone" required maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '');" placeholder="07XXXXXXXX">
        </div>
        <div class="field">
          <label data-i18n="labelColor">Bag Color</label>
          <select id="custColor" required>
            <option value="" disabled selected data-i18n="selectColor">Select a color</option>
            <option value="Blue" data-i18n="colorBlue">Blue</option>
            <option value="Pink" data-i18n="colorPink">Pink</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="labelNote">Special Note (optional)</label>
          <textarea id="custNote" rows="2"></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width:100%; margin-top:10px;" data-i18n="submitBtn">Send Order via WhatsApp</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p><strong>Ranowin Enterprises</strong></p>
    <p>📞 07X XXX XXXX | 📍 Your Address Here</p>
    <p style="font-size: 0.8rem; margin-top: 10px;">&copy; 2026 Ranowin Enterprises</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
