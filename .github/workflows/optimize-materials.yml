name: Optimize material photos
on:
  push:
    branches: [main]
    paths:
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - 'scripts/optimize_materials.py'
      - '.github/workflows/optimize-materials.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: material-optimization
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Build 720px WebP previews
        run: python scripts/optimize_materials.py
      - name: Save optimized previews
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Optimize material photo previews"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages rebuild
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
