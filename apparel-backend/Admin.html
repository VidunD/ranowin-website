<!doctype html><html><head><base target="_top"><style>
*{box-sizing:border-box}body{font:15px Arial,sans-serif;background:#f4f2f8;color:#242033;margin:0;padding:22px}main{max-width:1100px;margin:auto}h1{color:#43246f}section,.panel{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #24123a12}label{display:block;margin:10px 0;font-weight:600}input,textarea,select{display:block;width:100%;padding:11px;border:1px solid #c9c3d4;border-radius:8px;margin-top:5px;font:inherit}button{padding:10px 15px;border:0;border-radius:8px;background:#55318a;color:white;cursor:pointer;margin:5px 5px 5px 0}button.danger{background:#a52f46}.muted{color:#696274}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#e8e1f1;color:#39215b}.tabs button.active{background:#55318a;color:white}.product{border:1px solid #ddd6e7;padding:12px;border-radius:10px}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){body{padding:10px}.row{grid-template-columns:1fr}}
</style></head><body><main><h1>Ranowin Apparel Admin</h1><p class="muted">Separate apparel workspace · role-protected backend</p><section id="login"><form id="loginForm"><label>Admin email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form><p id="status"></p></section><div id="app" class="hidden"><section><span id="identity"></span><button id="logout" style="float:right">Log out</button><h2>Category workspaces</h2><div id="tabs" class="tabs"></div></section><section id="workspace"><h2 id="heading">Products</h2><button id="new">+ Add product</button><div id="products" class="grid"></div><form id="editor" class="hidden"><h3 id="formTitle">Product</h3><input id="pid" type="hidden"><label>Product name<input id="name" required maxlength="120"></label><label>Category<select id="category"></select></label><label>Base price (LKR)<input id="price" type="number" min="0" step=".01" required></label><label>Colours (comma separated)<input id="colors" placeholder="Black, White, Navy"></label><label>Sizes (comma separated)<input id="sizes" value="S, M, L, XL, 2XL"></label><label>Image URLs (one HTTPS URL per line)<textarea id="images" rows="3"></textarea></label><label>Description<textarea id="description" rows="3"></textarea></label><label><input id="active" type="checkbox" checked style="display:inline;width:auto"> Visible on website</label><button>Save product</button><button type="button" id="cancel">Cancel</button></form></section><section id="superTools" class="hidden"><h2>Super Admin controls</h2><form id="categoryForm"><label>Create new category<input id="newCategory" required maxlength="80" placeholder="e.g. Caps"></label><button>Add category workspace</button></form><p class="muted">Only Super Admin can create categories and edit global settings.</p></section></div></main><script>
let session=null,data=null,activeCategory='';
const $=id=>document.getElementById(id);
function call(name,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[name](...args));}
function status(s){$('status').textContent=s;}
async function refresh(){data=await call('getAdminData',session.token);draw();}
function draw(){ $('identity').textContent=session.email+' · '+session.role;$('superTools').classList.toggle('hidden',session.role!=='SUPER_ADMIN');const cats=data.categories;if(!cats.includes(activeCategory))activeCategory=cats[0]||'';$('tabs').innerHTML=cats.map(c=>'<button data-cat="'+esc(c)+'" class="'+(c===activeCategory?'active':'')+'">'+esc(c)+'</button>').join('');$('heading').textContent=activeCategory+' workspace';$('category').innerHTML=cats.map(c=>'<option>'+esc(c)+'</option>').join('');$('products').innerHTML=data.products.filter(p=>p.category===activeCategory).map(p=>'<article class="product"><strong>'+esc(p.name)+'</strong><p>LKR '+Number(p.basePrice).toLocaleString()+'</p><p>Sizes: '+esc(p.sizes.join(', '))+'</p><button data-edit="'+esc(p.id)+'">Edit</button><button class="danger" data-delete="'+esc(p.id)+'">Delete</button></article>').join('')||'<p>No products in this category yet.</p>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{session=await call('login',$('email').value,$('password').value);$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh();}catch(x){status(x.message||String(x));}};
$('tabs').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){activeCategory=b.dataset.cat;$('editor').classList.add('hidden');draw();}};
$('new').onclick=()=>{ $('editor').classList.remove('hidden');$('formTitle').textContent='Add '+activeCategory;$('pid').value='';$('name').value='';$('category').value=activeCategory;$('price').value='';$('colors').value='';$('sizes').value='S, M, L, XL, 2XL';$('images').value='';$('description').value='';$('active').checked=true;};
$('products').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const p=data.products.find(x=>x.id===b.dataset.edit);if(p){$('editor').classList.remove('hidden');$('pid').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.basePrice;$('colors').value=p.colors.join(', ');$('sizes').value=p.sizes.join(', ');$('images').value=p.images.join('\n');$('description').value=p.description;$('active').checked=p.active;}else if(b.dataset.delete){if(confirm('Delete this product?')){try{data=await call('deleteProduct',session.token,b.dataset.delete);draw();}catch(x){alert(x.message||x);}}}};
$('editor').onsubmit=async e=>{e.preventDefault();try{data=await call('saveProduct',session.token,{id:$('pid').value,name:$('name').value,category:$('category').value,basePrice:$('price').value,colors:$('colors').value.split(',').map(x=>x.trim()).filter(Boolean),sizes:$('sizes').value.split(',').map(x=>x.trim()).filter(Boolean),images:$('images').value.split('\n').map(x=>x.trim()).filter(Boolean),description:$('description').value,active:$('active').checked});$('editor').classList.add('hidden');draw();alert('Saved.');}catch(x){alert(x.message||x);}};
$('cancel').onclick=()=>$('editor').classList.add('hidden');
$('categoryForm').onsubmit=async e=>{e.preventDefault();try{data=await call('addCategory',session.token,$('newCategory').value);activeCategory=$('newCategory').value.trim();$('newCategory').value='';draw();}catch(x){alert(x.message||x);}};
$('logout').onclick=async()=>{try{await call('logout',session.token);}finally{location.reload();}};
</script></body></html>
