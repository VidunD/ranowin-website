<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Background Circle (Light Blue) -->
  <circle cx="300" cy="300" r="280" fill="#EBF5FB" />

  <!-- Bag Handles (Light Red/Pink) -->
  <path d="M 220 220 V 150 C 220 90, 380 90, 380 150 V 220" fill="none" stroke="#FFCDD2" stroke-width="30" stroke-linecap="round"/>

  <!-- Side Pockets (Light Red/Pink) -->
  <rect x="140" y="250" width="70" height="120" rx="25" fill="#FFCDD2" />
  <rect x="390" y="250" width="70" height="120" rx="25" fill="#FFCDD2" />

  <!-- Main Bag Body (Purple) -->
  <rect x="170" y="200" width="260" height="190" rx="40" fill="#6A1B9A" />

  <!-- Front Pocket (White) -->
  <rect x="210" y="250" width="180" height="110" rx="25" fill="#FFFFFF" />

  <!-- Cute Smiley on Pocket (Purple) -->
  <circle cx="270" cy="290" r="8" fill="#6A1B9A" />
  <circle cx="330" cy="290" r="8" fill="#6A1B9A" />
  <path d="M 280 315 Q 300 335 320 315" fill="none" stroke="#6A1B9A" stroke-width="7" stroke-linecap="round"/>

  <!-- Text: RANOWIN -->
  <text x="300" y="470" font-family="Arial, sans-serif" font-size="55" font-weight="bold" fill="#6A1B9A" text-anchor="middle" letter-spacing="3">RANOWIN</text>

  <!-- Text: ENTERPRISES -->
  <text x="300" y="515" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#D32F2F" text-anchor="middle" letter-spacing="8">ENTERPRISES</text>
</svg>
